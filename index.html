<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cronómetro FR, FC, goteos, etc.</title>
  <meta name="theme-color" content="#2B6CB0">
  <meta name="description" content="Cronómetro clínico para FR, FC y goteos">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="Icons/icon-192.png">
  <link rel="apple-touch-icon" href="Icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cronómetro">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header>
      <h1>Cronómetro FR, FC, goteos, etc.</h1>
      <p>Contá mentalmente entre Iniciar y Detener</p>
    </header>

    <div class="timer-card">
      <div class="timer" id="timer">00:00.0</div>
      <div class="status" id="status">Tocá Iniciar y contá en tu cabeza</div>
    </div>

    <button class="primary-btn start" id="mainBtn">Iniciar</button>

    <div class="entry" id="entry">
      <div class="elapsed" id="elapsedNote"></div>
      <label for="countInput">¿Cuántos beats contaste?</label>
      <div class="count-row">
        <button class="stepper" id="minusBtn" aria-label="Restar">−</button>
        <input id="countInput" type="number" inputmode="numeric" min="0" value="0">
        <button class="stepper" id="plusBtn" aria-label="Sumar">+</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="value" id="resultValue">—</div>
      <div class="unit">beats/minuto</div>
      <div class="detail" id="resultDetail"></div>
    </div>

    <footer>Herramienta clínica AR-UCIP</footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
